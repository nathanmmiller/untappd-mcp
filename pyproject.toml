[project]
name = "untappd-mcp"
version = "0.1.0"
description = "Untappd MCP server"
readme = "README.md"
authors = [
    { name = "Nathan Miller", email = "37555055+nathanmmiller@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
untappd-mcp = "untappd_mcp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]
